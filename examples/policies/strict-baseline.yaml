# The baseline from the security review, as one policy on Deployments:
# trusted registry, pinned tags, limits, non-root, nothing privileged.
# It reads as strict. Replay it before you believe that.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: strict-baseline
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  variables:
    - name: pod
      expression: object.spec.template.spec
  validations:
    - expression: variables.pod.containers.all(c, c.image.startsWith('registry.example.com/'))
      message: images must come from registry.example.com
    - expression: variables.pod.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: images must be pinned to a tag other than latest
    - expression: >-
        variables.pod.containers.all(c, has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: every container needs CPU and memory limits
    - expression: >-
        (has(variables.pod.securityContext) && has(variables.pod.securityContext.runAsNonRoot) &&
        variables.pod.securityContext.runAsNonRoot) ||
        variables.pod.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) &&
        c.securityContext.runAsNonRoot)
      message: pods must run as non-root
    - expression: >-
        variables.pod.containers.all(c, !has(c.securityContext) ||
        !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: privileged containers are not allowed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: strict-baseline
spec:
  policyName: strict-baseline
  validationActions: [Deny]
